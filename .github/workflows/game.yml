name: game
# Builds and publishes the horizon-client game binary for Windows

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/game.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build horizon-client
        run: |
          cargo build --release -p horizon-client

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p out
          cp target/release/horizon-client.exe out/
          cd out && 7z a horizon-client-windows-x64.zip horizon-client.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: horizon-client-windows-x64
          path: out/*
          retention-days: 7
